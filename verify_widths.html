<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三视图宽度验证</title>
<script type="module">import '/src/styles.css'</script>
<style>
  /* 测试页专用：解除滚动容器限高，让三视图同屏叠放便于测量 */
  .content{height:auto!important;overflow:visible!important;scrollbar-gutter:auto!important}
  .verify-label{display:block;font:600 13px/1.4 system-ui;color:#8a8078;padding:10px 40px 4px;background:#f0ebe6}
  .card-poster{background:#e5ddd5}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><span class="flower">❀</span><h1>HuaScope</h1></div><div class="sidebar-user">verify</div></div>
    <nav class="sidebar-nav">
      <button class="sidebar-nav-item active"><span class="sidebar-nav-icon">📋</span>电影列表</button>
      <button class="sidebar-nav-item"><span class="sidebar-nav-icon">🖼</span>海报墙</button>
      <button class="sidebar-nav-item"><span class="sidebar-nav-icon">📊</span>统计</button>
    </nav>
    <div class="sidebar-footer"><button class="sidebar-footer-btn"><span>🎲</span>随机抽一部</button></div>
  </aside>
  <main class="content">
    <div class="content-header"><h2>📋 电影列表</h2><div class="filters"></div></div>

    <span class="verify-label">▼ 视图1 · 列表 .list</span>
    <div class="content-body">
      <div class="list">
        <div class="card"><img class="card-poster"><div class="card-info"><div class="card-title">示例电影 A</div><div class="card-meta">2024 · 120min</div><div class="card-tags"><span class="tag tag-watched">🌸 看过</span></div></div><span class="card-flower">❀</span></div>
        <div class="card"><img class="card-poster"><div class="card-info"><div class="card-title">示例电影 B</div><div class="card-meta">2023 · 100min</div></div><span class="card-flower">❀</span></div>
        <div class="card"><img class="card-poster"><div class="card-info"><div class="card-title">示例电影 C</div><div class="card-meta">2022 · 90min</div></div><span class="card-flower">❀</span></div>
      </div>
    </div>

    <span class="verify-label">▼ 视图2 · 海报墙 .poster-wall</span>
    <div class="content-body">
      <div class="poster-wall">
        <button class="poster-item"><div class="poster-placeholder">🎬</div></button>
        <button class="poster-item"><div class="poster-placeholder">🎬</div></button>
        <button class="poster-item"><div class="poster-placeholder">🎬</div></button>
        <button class="poster-item"><div class="poster-placeholder">🎬</div></button>
        <button class="poster-item"><div class="poster-placeholder">🎬</div></button>
        <button class="poster-item"><div class="poster-placeholder">🎬</div></button>
      </div>
    </div>

    <span class="verify-label">▼ 视图3 · 统计 .stats</span>
    <div class="content-body">
      <div class="stats">
        <div class="stats-hero">
          <div class="stats-num">12</div><div class="stats-label">部已看过</div>
          <div class="stats-grid">
            <div class="stat-cell"><div class="stat-num">24h</div><div class="stat-label">总时长</div></div>
            <div class="stat-cell"><div class="stat-num">8.2</div><div class="stat-label">平均分</div></div>
            <div class="stat-cell"><div class="stat-num">5</div><div class="stat-label">年份</div></div>
          </div>
        </div>
        <div class="stats-card"><h3>观影趋势</h3><div class="bars"><div class="bar"><div class="bar-track"><div class="bar-fill" style="height:80%"></div></div><div class="bar-label">2024年8月</div><div class="bar-count">3</div></div></div></div>
        <div class="stats-card"><h3>类型偏好</h3><div class="genre-list"><div class="genre-row"><div class="genre-name">剧情</div><div class="genre-track"><div class="genre-fill" style="width:70%"></div></div><div class="genre-count">5</div></div></div></div>
      </div>
    </div>
  </main>
</div>

<pre id="result" style="position:fixed;left:12px;bottom:12px;background:#fff;border:2px solid #D4A5A5;padding:12px 16px;font:600 14px/1.7 monospace;z-index:9999;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)"></pre>
<script>
  function w(sel){var e=document.querySelector(sel);return e?Math.round(e.getBoundingClientRect().width):'N/A';}
  var list=w('.list'),poster=w('.poster-wall'),stats=w('.stats');
  var body=w('.content-body');
  var ok = (list===poster && poster===stats);
  document.getElementById('result').textContent =
    'content-body 宽 = '+body+'px\n'+
    '列表  .list        = '+list+'px\n'+
    '海报  .poster-wall = '+poster+'px\n'+
    '统计  .stats       = '+stats+'px\n'+
    '────────────────────\n'+
    (ok?'✅ 三视图宽度完全一致':'❌ 仍不一致');
</script>
</body>
</html>
